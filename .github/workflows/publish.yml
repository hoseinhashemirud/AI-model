name: Publish site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          cache: true

      - name: Check environment
        run: |
          echo "=== Pixi ==="
          pixi --version

          echo "=== Quarto ==="
          pixi run quarto --version

          echo "=== Repository ==="
          git status --short

          echo "=== Files ==="
          find . -maxdepth 2 -type f | sort

      - name: Render site
        run: |
          set +e

          echo "=== Running Quarto render ==="

          pixi run render > render.log 2>&1
          STATUS=$?

          cat render.log

          echo "=== Render exit status: $STATUS ==="

          exit $STATUS

      - name: Upload render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-render-log
          path: render.log
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

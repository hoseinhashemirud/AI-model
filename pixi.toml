[workspace]
name = "ai-course-site"
description = "Artificial Intelligence course site (Quarto)"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
preview = "quarto preview"
render = "quarto render"
check = "quarto check"

[dependencies]
quarto = ">=1.9.38,<2"
python = "3.11.*"
jupyter = ">=1.1.1,<2"
numpy = ">=2.4.6,<3"
matplotlib = ">=3.11.2,<4"
scikit-learn = ">=1.9.1,<2"
